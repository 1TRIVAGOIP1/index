<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Península — gestão de comunidade · malha OSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07191f;--panel:#0f262c;--panel2:#0a1c21;--line:#1e424a;
  --text:#e9e4d6;--muted:#93aaa8;--gold:#e8b84b;--red:#e2664b;--green:#74cf9a;--blue:#7fc7ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--panel2);color:var(--text);font-family:'Archivo',system-ui,sans-serif;font-size:13.5px}
#app{display:flex;height:100vh}
#mapWrap{flex:1;position:relative;min-width:0;background:radial-gradient(120% 90% at 42% 34%,#15505f 0%,#0a2a34 58%,#05161d 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#hud{position:absolute;inset:0 0 auto 0;padding:9px 14px;display:flex;gap:15px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(5,20,26,.95),rgba(5,20,26,0));pointer-events:none}
.brand{font-weight:800;font-size:16px;letter-spacing:-.02em;margin-right:2px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.res{display:flex;gap:5px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.res small{color:var(--muted);font-weight:500}
#heatBar{width:96px;height:7px;background:#1d3b42;border-radius:4px;overflow:hidden}
#heatFill{height:100%;width:0;background:linear-gradient(90deg,#7ec8a9,#e8b84b,#e2664b)}
#speed{position:absolute;bottom:12px;left:14px;display:flex;gap:5px;z-index:3}
#banner{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(6,24,30,.92);
  border:1px solid var(--gold);color:var(--gold);padding:7px 14px;border-radius:5px;font-weight:600;display:none}
#notifBell{position:absolute;top:12px;right:14px;z-index:4;min-width:42px;height:38px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:rgba(6,24,30,.88);color:var(--text);box-shadow:0 4px 14px #0006;cursor:pointer;pointer-events:auto}
#mapControls{position:absolute;right:14px;bottom:54px;z-index:5;display:flex;flex-direction:column;gap:5px;align-items:center}
#mapControls button{width:38px;height:36px;border:1px solid var(--line);border-radius:9px;background:rgba(6,24,30,.9);color:var(--text);font-size:18px;font-weight:800;box-shadow:0 4px 14px #0006;cursor:pointer}
#mapControls button:hover{background:#14313a}
#roadLayer.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,184,75,.25) inset}
#zoomReadout{min-width:38px;text-align:center;font:700 10px Archivo,sans-serif;color:var(--muted);background:rgba(6,24,30,.82);border:1px solid var(--line);border-radius:7px;padding:4px 3px}
#mapAttribution{position:absolute;left:12px;bottom:10px;z-index:4;font-size:9px;color:rgba(239,235,216,.72);background:rgba(5,19,24,.56);border:1px solid rgba(44,79,87,.6);border-radius:6px;padding:4px 7px;pointer-events:none}

#notifBell:hover{background:#14313a}
#notifBell .nbadge{display:inline-flex;min-width:17px;height:17px;align-items:center;justify-content:center;margin-left:3px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800}
#notifToasts{position:absolute;right:14px;top:58px;z-index:8;width:min(370px,calc(100% - 28px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ntoast{pointer-events:auto;background:rgba(8,28,34,.96);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;padding:10px 11px;box-shadow:0 8px 24px #0007;animation:notifIn .2s ease-out}
.ntoast.sev1{border-left-color:var(--gold)}.ntoast.sev2{border-left-color:var(--red)}
.ntoast .ntitle{font-size:12px;font-weight:800;margin-bottom:3px}.ntoast .nmsg{font-size:11.5px;line-height:1.4;color:var(--muted)}
.ntoast .nmeta{margin-top:6px;font-size:10px;color:#718b8b}
.nrow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #17363d;cursor:pointer}.nrow.unread{background:rgba(232,184,75,.045)}.nrow .nicon{width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#14313a;flex:0 0 auto}.nrow.sev1 .nicon{background:#4b3c16}.nrow.sev2 .nicon{background:#54261e}.nrow .nbody{min-width:0}.nrow .ntitle{font-weight:800;font-size:11.5px}.nrow .nmsg{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}.nrow .ntime{font-size:10px;color:#6f8888;margin-top:3px}
@keyframes notifIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#side{width:460px;flex:0 0 460px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:11px 4px;color:var(--muted);font-weight:700;font-size:12.5px}
#tabs button.on{color:var(--text);background:#14313a;box-shadow:inset 0 -2px 0 var(--gold)}
#tabAlertCount{display:inline-block;min-width:15px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:15px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted #22484f;cursor:pointer}
.alert:hover{background:rgba(255,255,255,.03)}
.alert i{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.alert.sev2 i{background:var(--red)} .alert.sev1 i{background:var(--gold)} .alert.sev0 i{background:var(--muted)}
.alert span{font-size:11.5px;line-height:1.4;color:var(--text)}
#head{padding:11px 15px 9px;border-bottom:1px solid var(--line)}
#head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
#head p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
#panel{flex:1;overflow-y:auto;padding:12px 15px 18px}
.block{margin-bottom:14px}
.block h3{margin:0 0 6px;font-size:11.5px;color:var(--muted);font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted #22484f;font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:none}
.row b{font-weight:700}
.bar{height:6px;background:#1d3b42;border-radius:3px;overflow:hidden;margin:3px 0 2px}
.bar i{display:block;height:100%;background:var(--green)}
button{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:#1a3b43;border:1px solid #2b5964;
  border-radius:5px;padding:6px 9px;cursor:pointer}
button:hover:not(:disabled){background:#265059}
button:disabled{opacity:.34;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.on{background:var(--gold);color:#20180a;border-color:#c79c33}
button.danger{border-color:#7a3a2d;color:#f0a793}
.btnrow{display:flex;gap:5px;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.item .nm{font-weight:700}
.item .ct{font-size:11px;color:var(--muted);line-height:1.35}
.chip{display:inline-block;padding:2px 7px;border-radius:20px;background:#1d3b42;font-size:11px;font-weight:600;margin:0 4px 4px 0}
.tag{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.55}
.warn{color:var(--red)}
#log{height:120px;overflow-y:auto;padding:7px 15px;font-size:11.5px;line-height:1.5;background:var(--panel2);border-top:1px solid var(--line);color:var(--muted)}
#log b{color:var(--text)}.hit{color:var(--red)}.win{color:var(--green)}.cop{color:var(--blue)}
#overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,14,19,.9);padding:20px;z-index:6}
#overlay.on{display:grid}
#overlay .card{max-width:580px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid #2b5964;border-radius:8px;padding:24px 26px}
#overlay h1{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
#overlay p{margin:0 0 13px;color:var(--muted);line-height:1.55}
#overlay ol{margin:0 0 16px;padding-left:20px;line-height:1.65}
@media(max-width:900px){#app{flex-direction:column}#side{width:100%;flex:0 0 auto;max-height:52vh;border-left:none;border-top:1px solid var(--line)}#mapWrap{flex:1 1 48vh}#log{height:70px}}

/* Painel lateral recolhível */
#side{position:relative;transition:width .18s ease,flex-basis .18s ease}
#side.collapsed{width:0;flex-basis:0;border-left:0;overflow:visible}
#side.collapsed > *{display:none}
#sideToggle{position:absolute;left:-30px;top:12px;z-index:50;width:30px;height:34px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--panel);color:var(--text);font-size:16px;cursor:pointer;box-shadow:0 4px 14px #0006}
#side.collapsed #sideToggle{display:block;left:0;border:1px solid var(--line);border-radius:0 8px 8px 0}
#coordGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.coordCard{border:1px solid var(--line);background:#0b2026;border-radius:8px;padding:9px}
.coordCard .ct{line-height:1.4}
.dep{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #17363d}
.dep:last-child{border-bottom:0}
.depNeed{color:var(--gold);font-size:11px}
.pillGood{color:var(--green)}.pillWarn{color:var(--gold)}
/* Dashboard administrativo — desktop amplo e leitura rápida */
.dashHero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kpi{background:linear-gradient(145deg,#102c33,#0b2026);border:1px solid #214952;border-radius:10px;padding:10px;min-width:0;box-shadow:0 5px 16px #0003}
.kpi .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kpi .value{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .delta{font-size:10px;color:var(--muted);margin-top:3px}
.kpi.good .value{color:var(--green)}.kpi.warn .value{color:var(--gold)}.kpi.bad .value{color:var(--red)}
.chartCard{background:#0b2026;border:1px solid #1d4149;border-radius:10px;padding:10px;margin-bottom:9px}
.chartHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.chartTitle{font-weight:800;font-size:12px}.chartSub{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.35}
.chartSvg{display:block;width:100%;height:108px;overflow:visible}
.chartLegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:10px;color:var(--muted)}
.legendDot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dashMini{background:#0b2026;border:1px solid #1d4149;border-radius:9px;padding:9px}.dashMini b{display:block;font-size:15px;margin-top:3px}.dashMini span{font-size:10px;color:var(--muted)}
.progress{height:8px;background:#17343b;border-radius:8px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.sideSection{border-top:1px solid #17363d;padding-top:9px;margin-top:9px}
@media(max-width:900px){#side{width:100%;flex-basis:auto}.dashHero{grid-template-columns:repeat(2,minmax(0,1fr))}.chartSvg{height:96px}}
@media(min-width:901px) and (max-width:1250px){#side{width:400px;flex-basis:400px}}


/* Menu inicial + responsividade mobile */
.menuCard{width:min(620px,100%);text-align:left}
.menuLogo{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.menuTitle{font-size:32px!important;margin-bottom:6px!important}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.menuField{display:flex;flex-direction:column;gap:6px}
.menuField.full{grid-column:1/-1}
.menuField label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.menuField input,.menuField select{width:100%;background:#0a1c21;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:11px 12px;font:inherit;outline:none}
.menuField input:focus,.menuField select:focus{border-color:var(--gold)}
.menuActions{display:flex;gap:8px;margin-top:14px}
.menuActions button{flex:1;min-height:44px}
.menuNote{padding:10px 12px;border:1px solid #17363d;border-radius:6px;background:#0b2026;color:var(--muted);line-height:1.45;font-size:12px}
@media(max-width:900px){
  html,body{overflow:hidden}
  #app{height:100dvh;min-height:0}
  #mapWrap{min-height:0;flex:1 1 56dvh}
  #side{height:44dvh;max-height:44dvh;min-height:0;transition:height .18s ease,max-height .18s ease,width .18s ease}
  #side.collapsed{height:0;max-height:0;flex-basis:0}
  #tabs{overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{flex:0 0 auto;min-width:92px;min-height:44px;padding:0 10px}
  #head{padding:9px 12px 7px}
  #panel{padding:10px 12px 14px}
  #log{height:58px;padding:6px 12px}
  #hud{padding:7px 9px;gap:8px;font-size:12px}
  .brand{font-size:14px}.brand small{font-size:9px}
  #heatBar{width:66px}
  #notifBell{top:9px;right:9px;min-width:40px;height:36px}
  #mapControls{right:9px;bottom:54px}
  #notifToasts{right:9px;top:52px;width:min(360px,calc(100% - 18px))}
  #speed{left:8px;bottom:8px}
  #speed button{min-width:38px;min-height:38px;padding:0 7px}
  #sideToggle{position:absolute;left:auto;right:10px;top:-38px;width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 4px 14px #0006}
  #side.collapsed #sideToggle{display:block;right:10px;left:auto;top:-38px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  #overlay{padding:12px}
  #overlay .card{width:min(100%,560px);max-height:92dvh;padding:20px 16px;border-radius:10px}
  #overlay h1{font-size:22px}
  .menuTitle{font-size:28px!important}
  .menuGrid{grid-template-columns:1fr;gap:9px;margin:12px 0}
  .menuField.full{grid-column:auto}
  .menuActions{flex-direction:column}
}
@media(max-width:430px){#rTerr,#rUnits{font-size:11px}.res{gap:3px}.menuTitle{font-size:25px!important}}

/* ===== Mercado de ofertas + complexos especializados ===== */
.marketOffer{border:1px solid rgba(127,199,255,.22);border-radius:10px;padding:11px;margin:8px 0;background:linear-gradient(135deg,rgba(19,50,58,.92),rgba(10,30,36,.92));box-shadow:0 6px 18px rgba(0,0,0,.12)}
.marketOffer.hot{border-color:rgba(232,184,75,.45)}
.marketOffer .offerTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.marketOffer .offerName{font-weight:800;font-size:14px}.marketOffer .offerMeta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.marketOffer .offerPrice{font-size:17px;font-weight:800;color:var(--gold);white-space:nowrap}.marketOffer .offerActions{display:flex;gap:6px;margin-top:9px}.marketOffer select{flex:1;min-width:0;background:#102d33;color:var(--text);border:1px solid #2b5964;border-radius:6px;padding:6px}
.factoryCard{border:1px solid rgba(232,184,75,.25);border-radius:10px;padding:11px;background:linear-gradient(135deg,rgba(42,48,37,.5),rgba(10,30,36,.7));margin:8px 0}
.factoryHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.factoryIcon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(232,184,75,.13);border:1px solid rgba(232,184,75,.24);font-size:18px}.factoryTitle{display:flex;gap:9px;align-items:center}.factoryTitle b{font-size:14px}.factoryTitle small{display:block;color:var(--muted);margin-top:2px}.factoryStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.factoryStat{background:rgba(5,20,24,.35);border-radius:7px;padding:7px}.factoryStat span{display:block;color:var(--muted);font-size:10px}.factoryStat b{font-size:12px}.factoryDependency{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.4}.factoryDependency strong{color:var(--text)}
.tabBadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:800}
@media(max-width:900px){.marketOffer .offerActions{flex-direction:column}.factoryStats{grid-template-columns:1fr 1fr}}

</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="brand">Península<small id="clock">Dia 1 · 06:00</small></div>
      <div class="res"><span>💵</span><span id="rMoney">0</span><small id="rNet"></small></div>
      <div class="res"><span>🏳️</span><span id="rTerr">0</span></div>
      <div class="res"><span>👤</span><span id="rUnits">0</span></div>
      <div class="res"><span>🚨</span><div id="heatBar"><i id="heatFill"></i></div><small id="heatTxt">0%</small></div>
    </div>
    <div id="notifBell" title="Abrir notificações" aria-label="Abrir notificações">🔔<span class="nbadge" id="notifBadge" style="display:none">0</span></div>
    <div id="mapAttribution">Malha viária © OpenStreetMap contributors</div>
    <div id="mapControls" aria-label="Controles do mapa">
      <button id="zoomIn" type="button" title="Aproximar">+</button>
      <span id="zoomReadout">100%</span>
      <button id="zoomOut" type="button" title="Afastar">−</button>
      <button id="zoomReset" type="button" title="Centralizar mapa">⌂</button>
      <button id="roadLayer" type="button" title="Alternar malha viária real">🛣️</button>
    </div>
    <div id="notifToasts" aria-live="polite" aria-atomic="false"></div>
    <div id="speed">
      <button data-sp="0">❚❚</button><button data-sp="1" class="on">1×</button>
      <button data-sp="3">3×</button><button data-sp="8">8×</button><button data-sp="20">20×</button>
    </div>
    <div id="banner"></div>
    <div id="overlay"><div class="card" id="overlayCard"></div></div>
  </div>
  <aside id="side">
    <button id="sideToggle" type="button" title="Fechar painel lateral" aria-label="Fechar painel lateral">❯</button>
    <div id="tabs">
      <button data-tab="terr" class="on">Comunidade</button>
      <button data-tab="logi">Apoio e circulação</button>
      <button data-tab="painel">Painel<span id="tabAlertCount"></span></button>
      <button data-tab="notif">Avisos<span id="tabNotifCount"></span></button>
      <button data-tab="mercado">Mercado<span id="tabMarketCount"></span></button>
      <button data-tab="fac">Firma</button>
      <button data-tab="coord">Coordenação</button>
    </div>
    <div id="head"><h2 id="selName">Península</h2><p id="selSub">Selecione um território no mapa.</p></div>
    <div id="panel"></div>
    <div id="log"></div>
  </aside>
</div>

<div id="bootError" style="display:none;position:fixed;inset:0;z-index:99999;background:#07151b;color:#f4efe3;font-family:system-ui,sans-serif;padding:28px;box-sizing:border-box;align-items:center;justify-content:center;text-align:center"><div style="max-width:620px"><h2 style="margin:0 0 10px">Península não conseguiu iniciar</h2><p style="color:#b9c4c8">O jogo encontrou um erro de inicialização. Recarregue a página; se o problema persistir, use esta versão estável.</p><pre id="bootErrorText" style="white-space:pre-wrap;color:#f0b37e;font-size:12px;text-align:left"></pre></div></div>
<script>
(function(){
  function show(e){
    var box=document.getElementById('bootError'), txt=document.getElementById('bootErrorText');
    if(!box) return; box.style.display='flex';
    if(txt) txt.textContent=(e && (e.message || e.error && e.error.message)) || 'Erro de inicialização';
  }
  window.addEventListener('error',function(e){ show(e.error || e); });
  window.addEventListener('unhandledrejection',function(e){ show(e.reason || e); });
})();
</script>

<!-- MAIN GAME MODULES -->

<script src="js/ui/theme-loader.js"></script>
<script src="js/01_config.js"></script>

<script src="js/02_mapdata.js"></script>
<script src="js/03_roadnet.js"></script>
<script src="js/04_world.js"></script>
<script src="js/05_economy.js"></script>
